<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none" role="img" aria-label="Kumasi trotro corridor illustration">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2822"/>
      <stop offset="100%" stop-color="#0c1210"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#sky)"/>
  <ellipse cx="900" cy="120" rx="280" ry="180" fill="#E04A00" opacity="0.12"/>
  <ellipse cx="200" cy="400" rx="200" ry="120" fill="#14B8A6" opacity="0.08"/>
  <!-- Road -->
  <path d="M0 420 Q300 380, 600 400 T1200 380 L1200 520 L0 520 Z" fill="url(#road)"/>
  <path d="M0 460 L1200 460" stroke="#E04A00" stroke-width="3" stroke-dasharray="24 16" opacity="0.5"/>
  <!-- Buildings silhouette -->
  <rect x="80" y="280" width="60" height="140" rx="4" fill="#1e2e28" opacity="0.8"/>
  <rect x="160" y="240" width="80" height="180" rx="4" fill="#243832" opacity="0.9"/>
  <rect x="260" y="300" width="50" height="120" rx="4" fill="#1e2e28" opacity="0.7"/>
  <rect x="900" y="260" width="70" height="160" rx="4" fill="#243832"/>
  <rect x="990" y="220" width="90" height="200" rx="4" fill="#1e2e28"/>
  <rect x="1100" y="290" width="60" height="130" rx="4" fill="#243832" opacity="0.85"/>
  <!-- Trotro van -->
  <rect x="420" y="368" width="200" height="72" rx="14" fill="#E04A00"/>
  <rect x="440" y="384" width="50" height="40" rx="6" fill="rgba(255,255,255,0.25)"/>
  <rect x="500" y="384" width="50" height="40" rx="6" fill="rgba(255,255,255,0.25)"/>
  <rect x="560" y="384" width="40" height="40" rx="6" fill="rgba(255,255,255,0.25)"/>
  <circle cx="460" cy="448" r="16" fill="#0A0A0A"/>
  <circle cx="580" cy="448" r="16" fill="#0A0A0A"/>
  <circle cx="460" cy="448" r="8" fill="#333"/>
  <circle cx="580" cy="448" r="8" fill="#333"/>
  <text x="630" y="412" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">TrotroOS</text>
  <!-- GPS pulse -->
  <circle cx="520" cy="340" r="12" fill="#14B8A6"/>
  <circle cx="520" cy="340" r="28" stroke="#14B8A6" stroke-width="2" opacity="0.4"/>
  <circle cx="520" cy="340" r="48" stroke="#14B8A6" stroke-width="1" opacity="0.2"/>
  <!-- Labels -->
  <text x="80" y="560" font-family="system-ui,sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">Tech Junction</text>
  <text x="520" y="560" font-family="system-ui,sans-serif" font-size="13" fill="rgba(255,255,255,0.5)" text-anchor="middle">En route · live GPS</text>
  <text x="1120" y="560" font-family="system-ui,sans-serif" font-size="13" fill="rgba(255,255,255,0.5)" text-anchor="end">Ayeduase</text>
  <path d="M100 530 C350 520, 550 500, 1100 530" stroke="#14B8A6" stroke-width="2" stroke-dasharray="6 8" opacity="0.6"/>
</svg>
