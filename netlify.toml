[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/track"
  to = "/track.html"
  status = 200

[[redirects]]
  from = "/track/*"
  to = "/track.html"
  status = 200

[[redirects]]
  from = "/invite"
  to = "/app/"
  status = 302

[[redirects]]
  from = "/news"
  to = "/news.html"
  status = 200

[[redirects]]
  from = "/careers"
  to = "/careers.html"
  status = 200

[[redirects]]
  from = "/partners"
  to = "/partners.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/accessibility"
  to = "/accessibility.html"
  status = 200

[[redirects]]
  from = "/security"
  to = "/security.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app/index.html"
  status = 200

# Expo web static assets — must not fall through to SPA fallback
[[redirects]]
  from = "/app/_expo/*"
  to = "/app/_expo/:splat"
  status = 200

[[redirects]]
  from = "/app/assets/*"
  to = "/app/assets/:splat"
  status = 200

[[redirects]]
  from = "/app/favicon.ico"
  to = "/app/favicon.ico"
  status = 200

[[redirects]]
  from = "/app/manifest.webmanifest"
  to = "/app/manifest.webmanifest"
  status = 200

# Client-side routes inside the Expo web app
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200
